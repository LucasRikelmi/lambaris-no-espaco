services:
  simulador:
    image: python:3.12-alpine
    working_dir: /app
    command: python server.py
    ports: ["8080:8080"]
    volumes: [".:/app:ro"]
    env_file: [.env]
    depends_on: [qdrant, voz, ollama]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["modelos:/root/.ollama"]
    env_file: [.env]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "Baixando/verificando modelos: $$GEMMA_MODEL, $$MEDGEMMA_MODEL, $$EMBED_MODEL"
        ollama pull "$$GEMMA_MODEL"
        ollama pull "$$MEDGEMMA_MODEL"
        ollama pull "$$EMBED_MODEL"
        echo "Modelos prontos. Ollama em 0.0.0.0:11434."
        wait
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports: ["6333:6333", "6334:6334"]
    volumes: ["procedimentos:/qdrant/storage"]
  voz:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports: ["8880:8880"]
    volumes: ["vozes:/app/api/src/voices/v1_0"]
volumes:
  procedimentos:
  vozes:
  modelos:
